server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: autonomous-mower-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mower}
    username: ${SPRING_DATASOURCE_USERNAME:mower}
    password: ${SPRING_DATASOURCE_PASSWORD:mower}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.autonomousmower: INFO
