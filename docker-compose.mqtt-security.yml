# 기존 서비스와 데이터를 참조하지 않는 MQTT 보안 검사 전용 구성이다.
name: mower-mqtt-security
services:
  mqtt-security:
    image: eclipse-mosquitto@sha256:a908c65cc8e67ec9d292ef27c2c0360dbaaee7eb1b935cdd194e67697f15dea1
    container_name: ${MQTT_SECURITY_CONTAINER:?테스트 컨테이너 이름을 지정하세요}
    ports:
      - "127.0.0.1:18886:8883"
    tmpfs:
      - /mosquitto/private
    # Windows bind mount의 Linux 권한 대신 컨테이너 메모리 안에 제한된 복사본을 사용한다.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp /mosquitto/security/passwords /mosquitto/security/acl /mosquitto/security/server.crt /mosquitto/security/server.key /mosquitto/private/
        chown -R mosquitto:mosquitto /mosquitto/private
        chmod 0700 /mosquitto/private /mosquitto/private/*
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./docker/mosquitto/mosquitto-security-test.conf:/mosquitto/config/mosquitto.conf:ro
      - ${MQTT_SECURITY_DIR:?테스트 인증서 폴더를 지정하세요}:/mosquitto/security:ro
