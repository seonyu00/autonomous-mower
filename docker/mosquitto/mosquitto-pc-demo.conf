# PC 적용 단계는 loopback TLS만 연다. Jetson 접속 주소·계정은 별도 적용한다.
listener 8883
allow_anonymous false
password_file /mosquitto/private/passwords
acl_file /mosquitto/private/acl
certfile /mosquitto/private/server.crt
keyfile /mosquitto/private/server.key
tls_version tlsv1.2
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
