<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPP 현장 시험 지도</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f1;color:#203d35;font:16px/1.6 system-ui,sans-serif}header{padding:20px 28px;border-bottom:1px solid #ccd8cf;background:white;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:24px;margin:0}small{color:#5d746b}strong.tag{background:#e6efe8;padding:6px 14px;border-radius:20px;font-size:14px}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;padding:24px;height:calc(100vh - 104px)}section,aside{background:white;border:1px solid #d5dfd7;border-radius:12px;padding:20px}section{display:flex;flex-direction:column;min-height:380px}canvas{width:100%;flex:1;min-height:250px}aside{overflow:auto}h2{font-size:17px;margin:0 0 16px}dl{margin:0}dt{font-size:13px;color:#5d746b;margin-top:18px}dd{margin:4px 0;overflow-wrap:anywhere;font-weight:600}#message{color:#945326;min-height:50px}footer{font-size:13px;color:#5d746b}.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;margin-top:14px}.legend span:before{content:'●';margin-right:5px;color:var(--c)}@media(max-width:760px){main{height:auto;grid-template-columns:1fr;padding:12px}header{padding:15px;flex-wrap:wrap}canvas{height:420px;flex:none}aside{overflow:visible}}
</style>
<header><div><small>실제 센서 · 팀원 비전 + CPP</small><h1>현장 시험 지도</h1></div><strong class="tag">모터 출력 없음</strong></header>
<main><section><h2>작업 구역 · 장애물 · 예정 경로</h2><canvas id="map" aria-label="미터 단위 평면 시험 지도"></canvas><div class="legend"><span style="--c:#26835a">작업 구역</span><span style="--c:#367fc5">CPP 경로</span><span style="--c:#bc4439">정적 장애물</span><span style="--c:#bd780e">동적·미확인 장애물</span></div><footer>북쪽이 위입니다. 위성 배경 없는 시험 지도이며 실제 주행 허가를 뜻하지 않습니다.</footer></section>
<aside><h2>연결과 센서 상태</h2><p id="message" role="status">시험기에 연결하고 있습니다.</p><dl><dt>서버 구역</dt><dd id="zone">—</dd><dt>구역 버전</dt><dd id="version">—</dd><dt>CPP 상태</dt><dd id="status">대기</dd><dt>보류 사유</dt><dd id="reason">—</dd><dt>장애물 좌표계</dt><dd id="frame">—</dd><dt>자세 입력</dt><dd id="pose">—</dd><dt>근접 검사</dt><dd id="near">—</dd><dt>경로점 / 변경 번호</dt><dd id="path">—</dd><dt>관측 나이</dt><dd id="age">—</dd></dl></aside></main>
<script>
const el=id=>document.getElementById(id),canvas=el('map'),ctx=canvas.getContext('2d');let current=null;
const reasons={near_unknown_obstacle:'전방 근접 물체 감지',near_depth_unavailable:'최신 깊이 정보 없음',near_guard_manual_resume_required:'근접 정지 후 재개 대기', 'heading not ready':'방향 입력 미준비',work_zone_unavailable:'작업 구역 조회 불가',pose_stale:'위치·방향 만료',yaw_unsynchronized_or_missing:'위치·방향 시각 불일치'};
function draw(d){const rect=canvas.getBoundingClientRect();canvas.width=rect.width*devicePixelRatio;canvas.height=rect.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);const W=rect.width,H=rect.height;ctx.clearRect(0,0,W,H);
 const zone=d?.zone?.polygon||[];if(zone.length<3){ctx.fillStyle='#5d746b';ctx.font='16px system-ui';ctx.fillText('서버 작업 구역을 기다리고 있습니다.',24,50);return;}
 const origin=zone[0],R=6378137,k=Math.PI/180,cs=Math.cos(origin.lat*k),xy=p=>[(p.lon-origin.lon)*k*R*cs,(p.lat-origin.lat)*k*R];const ring=zone.map(xy),xs=ring.map(p=>p[0]),ys=ring.map(p=>p[1]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),scale=Math.min((W-64)/Math.max(1,maxX-minX),(H-64)/Math.max(1,maxY-minY));const point=p=>[32+(p[0]-minX)*scale,H-32-(p[1]-minY)*scale];
 function line(points,color,fill,close=false){if(!points.length)return;ctx.beginPath();points.forEach((p,i)=>{const a=point(p);i?ctx.lineTo(...a):ctx.moveTo(...a)});if(close)ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();}
 line(ring,'#26835a','#eef5ef',true);const e=d.event||{},snap=e.obstacle_snapshot||{},plan=d.result?.planning||{},stale=Date.now()/1000-(d.received_at||0)>2||!snap.pose_valid||!snap.observation_fresh;ctx.globalAlpha=stale?.3:1;
 if(snap.frame==='local_enu'&&snap.origin_wgs84){const o=xy(snap.origin_wgs84);for(const [group,color] of [['static_objects','#bc4439'],['dynamic_objects','#bd780e'],['temporary_objects','#bd780e']])for(const obj of snap[group]||[]){line((obj.region_m||[]).map(p=>[o[0]+p.east,o[1]+p.north]),color,color+'33',true);}}
 if(!stale)line((plan.remaining_path||[]).map(xy),'#367fc5');const pose=e.pose||{};if(pose.valid&&Number.isFinite(pose.lat)&&Number.isFinite(pose.lon)){const p=point(xy(pose));ctx.beginPath();ctx.arc(...p,6,0,2*Math.PI);ctx.fillStyle='#203d35';ctx.fill();if(pose.yaw_ready){ctx.beginPath();ctx.moveTo(...p);ctx.lineTo(p[0]+20*Math.cos(pose.yaw_enu_rad),p[1]-20*Math.sin(pose.yaw_enu_rad));ctx.strokeStyle='#203d35';ctx.stroke();}}
 ctx.globalAlpha=1;ctx.fillStyle='#5d746b';ctx.font='12px system-ui';ctx.fillText('N ↑',W-45,20);ctx.fillText(`${(maxX-minX).toFixed(1)} × ${(maxY-minY).toFixed(1)} m`,12,H-6);}
function update(d){const e=d.event||{},s=e.obstacle_snapshot||{},r=d.result||{},p=r.planning||{},age=(Date.now()-(s.observation_unix_ms||0))/1000,stale=Date.now()/1000-(d.received_at||0)>2;el('zone').textContent=d.zone?.work_zone_id||'—';el('version').textContent=d.zone?.work_zone_version??'—';el('status').textContent=r.status||'대기';el('reason').textContent=reasons[r.reason]||r.reason||'—';el('frame').textContent=s.frame||'대기';el('pose').textContent=e.pose?.valid?'유효':'사용 불가';el('near').textContent=reasons[s.near_guard?.status]||s.near_guard?.status||'대기';el('path').textContent=`${p.remaining_path?.length||0} / ${p.route_revision??'—'}`;el('age').textContent=s.observation_unix_ms?`${age.toFixed(1)}초`:'없음';el('message').textContent=stale?'입력 대기 또는 수신 중단 · 경로 사용 불가':r.planning?'경로 계산 결과 수신 · 주행하지 않습니다':'센서·지도 조건을 확인하고 있습니다';draw(d);}
async function poll(){try{const response=await fetch('/state.json',{cache:'no-store',signal:AbortSignal.timeout(2000)});if(!response.ok)throw Error();current=await response.json();update(current);}catch{current=null;el('message').textContent='시험기 연결 끊김 · 마지막 그림은 과거 기록입니다';draw(null);}setTimeout(poll,500);}window.addEventListener('resize',()=>draw(current));poll();
</script></html>
